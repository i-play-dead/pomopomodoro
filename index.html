<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozy Study Nook</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #fcf4f4;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-color: #5c4b51;
      --accent-color: #f3a683;
      --accent-hover: #e77f67;
      --shadow: 0 8px 24px rgba(149, 157, 165, 0.15);
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.4s ease, color 0.3s ease;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1, h2, h3 {
      font-family: 'Fredoka', sans-serif;
      margin-top: 0;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Timer Styles */
    .timer-display {
      font-size: 4rem;
      font-family: 'Fredoka', sans-serif;
      color: var(--accent-color);
      margin: 15px 0;
    }

    .mode-badge {
      background-color: var(--accent-color);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      font-family: 'Fredoka', sans-serif;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    button.secondary {
      background-color: #e0e0e0;
      color: var(--text-color);
    }

    button.secondary:hover {
      background-color: #d0d0d0;
    }

    /* Settings Inputs */
    .setting-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin: 8px 0;
    }

    label {
      font-weight: 700;
      font-size: 0.95rem;
    }

    input[type="number"], select {
      padding: 8px 12px;
      border-radius: 10px;
      border: 2px solid #eee;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      width: 100%;
      max-width: 160px;
      text-align: center;
    }

    /* Theme Picker Dots */
    .theme-picker {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .theme-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* Video Frame */
    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-top: 10px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: white;
      padding: 30px;
      border-radius: 24px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transform: scale(0.8);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal h2 {
      color: var(--accent-color);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>✨ Cozy Focus Nook</h1>

  <div class="container">
    <!-- Left Column: Timer & Controls -->
    <div class="card">
      <span class="mode-badge" id="mode-badge">Study Session</span>
      <div class="timer-display" id="timer-display">25:00</div>
      
      <div class="controls">
        <button id="start-btn">Start</button>
        <button id="pause-btn" class="secondary">Pause</button>
        <button id="reset-btn" class="secondary">Reset</button>
      </div>

      <hr style="width:100%; margin: 24px 0; border: none; border-top: 2px dashed #eee;" />

      <h3>⚙️ Preferences</h3>
      
      <div class="setting-group">
        <label for="study-time">Study Minutes:</label>
        <input type="number" id="study-time" value="25" min="1" max="120" />
      </div>

      <div class="setting-group">
        <label for="pause-time">Pause Minutes:</label>
        <input type="number" id="pause-time" value="5" min="1" max="60" />
      </div>

      <div class="setting-group">
        <label>Theme Palette:</label>
        <div class="theme-picker">
          <div class="theme-dot" style="background:#fcf4f4;" onclick="setTheme('#fcf4f4', '#f3a683', '#e77f67')"></div>
          <div class="theme-dot" style="background:#e8f5e9;" onclick="setTheme('#e8f5e9', '#81c784', '#66bb6a')"></div>
          <div class="theme-dot" style="background:#e3f2fd;" onclick="setTheme('#e3f2fd', '#64b5f6', '#42a5f5')"></div>
          <div class="theme-dot" style="background:#f3e5f5;" onclick="setTheme('#f3e5f5', '#ba68c8', '#ab47bc')"></div>
        </div>
      </div>
    </div>

    <!-- Right Column: YouTube Music & Ambiance -->
    <div class="card">
      <h3>🎧 Background Video</h3>
      <div class="setting-group">
        <label for="video-select">Choose Ambiance:</label>
        <select id="video-select" onchange="changeVideo()">
          <option value="DWcJFNfaw9c">Cozy Lofi Beats</option>
          <option value="S_MOd40L96U">Rainy Coffee Shop</option>
          <option value="lTRiuFIWV54">Ghibli Piano Playlist</option>
          <option value="W0LHTWG-UmQ">Quiet Library Sounds</option>
        </select>
      </div>

      <div class="video-container">
        <iframe 
          id="youtube-player" 
          src="https://www.youtube.com/embed/DWcJFNfaw9c?enablejsapi=1&origin=*&rel=0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <!-- Notification Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2>🎉 Great Job!</h2>
      <p id="modal-text">You completed your study session! Ready to start your pause?</p>
      <div class="modal-buttons">
        <button onclick="confirmPause()">Start Pause</button>
        <button class="secondary" onclick="closeModal()">Dismiss</button>
      </div>
    </div>
  </div>

  <script>
    let studyDuration = 25 * 60;
    let pauseDuration = 5 * 60;
    let timeRemaining = studyDuration;
    let timerInterval = null;
    let isStudying = true;

    const timerDisplay = document.getElementById('timer-display');
    const modeBadge = document.getElementById('mode-badge');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const resetBtn = document.getElementById('reset-btn');
    const studyInput = document.getElementById('study-time');
    const pauseInput = document.getElementById('pause-time');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalText = document.getElementById('modal-text');

    function playChime() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
      osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.5); 

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 1);
    }

    function updateDisplay() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        timeRemaining--;
        updateDisplay();

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          playChime();
          
          if (isStudying) {
            modalText.textContent = "You finished your study session! Want to start your pause?";
            modalOverlay.classList.add('active');
          } else {
            modalText.textContent = "Pause is over! Ready to focus again?";
            modalOverlay.classList.add('active');
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      pauseTimer();
      studyDuration = parseInt(studyInput.value, 10) * 60;
      pauseDuration = parseInt(pauseInput.value, 10) * 60;
      timeRemaining = isStudying ? studyDuration : pauseDuration;
      updateDisplay();
    }

    function confirmPause() {
      closeModal();
      isStudying = !isStudying;
      
      if (!isStudying) {
        modeBadge.textContent = "Pause Session";
        modeBadge.style.backgroundColor = "#78e08f";
        timeRemaining = pauseDuration;
      } else {
        modeBadge.textContent = "Study Session";
        modeBadge.style.backgroundColor = "var(--accent-color)";
        timeRemaining = studyDuration;
      }
      
      updateDisplay();
      startTimer();
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    function setTheme(bgColor, accentColor, accentHover) {
      document.documentElement.style.setProperty('--bg-color', bgColor);
      document.documentElement.style.setProperty('--accent-color', accentColor);
      document.documentElement.style.setProperty('--accent-hover', accentHover);
    }

    function changeVideo() {
      const videoId = document.getElementById('video-select').value;
      document.getElementById('youtube-player').src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&origin=*&rel=0`;
    }

    // Event Listeners
    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);

    studyInput.addEventListener('change', () => {
      studyDuration = parseInt(studyInput.value, 10) * 60;
      if (isStudying) resetTimer();
    });

    pauseInput.addEventListener('change', () => {
      pauseDuration = parseInt(pauseInput.value, 10) * 60;
      if (!isStudying) resetTimer();
    });

    updateDisplay();
  </script>
</body>
</html>
