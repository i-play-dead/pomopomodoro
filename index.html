<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studia per favore a Dio</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #FFD8DF;
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-color: #4a3e3d;
      --accent-color: #e27d60;
      --accent-hover: #c96549;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* No scrollbars */
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Wide compact card */
    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 28px 40px;
      box-shadow: var(--shadow);
      width: 90%;
      max-width: 820px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.6rem;
      margin: 0;
    }

    .mode-badge {
      background-color: var(--accent-color);
      color: white;
      padding: 5px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Giant Centered Timer */
    .timer-display {
      font-size: 6rem;
      font-family: 'Fredoka', sans-serif;
      color: var(--accent-color);
      margin: 0 0 16px 0;
      line-height: 1;
      letter-spacing: -2px;
    }

    .controls {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
      width: 100%;
      justify-content: center;
    }

    /* Base White Buttons */
    .controls button {
      font-family: 'Fredoka', sans-serif;
      background-color: #ffffff;
      color: var(--text-color);
      border: 2px solid rgba(0, 0, 0, 0.06);
      padding: 10px 28px;
      border-radius: 14px;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .controls button:hover {
      background-color: #f7f7f7;
      transform: translateY(-2px);
    }

    /* Highlighted active state on click */
    .controls button.active {
      background-color: var(--accent-color) !important;
      color: #ffffff !important;
      border-color: var(--accent-color) !important;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    .divider {
      width: 100%;
      height: 1px;
      background-color: rgba(0, 0, 0, 0.08);
      margin: 12px 0 18px 0;
    }

    /* Horizontal Bottom Panel */
    .bottom-panel {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 16px;
      width: 100%;
      align-items: center;
    }

    .panel-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .panel-item label {
      font-size: 0.75rem;
      font-weight: 700;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-box-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .input-sub-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 50%;
    }

    .input-sub-item span {
      font-size: 0.65rem;
      font-weight: 700;
      opacity: 0.6;
      margin-top: 2px;
    }

    input[type="number"], select {
      padding: 8px 10px;
      border-radius: 12px;
      border: 1.5px solid rgba(0,0,0,0.1);
      background: rgba(255, 255, 255, 0.8);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      width: 100%;
      text-align: center;
      color: var(--text-color);
    }

    input[type="number"]:focus, select:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    /* Minimal Theme Picker */
    .theme-picker {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .theme-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .theme-dot:hover {
      transform: scale(1.15);
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: white;
      padding: 28px 24px;
      border-radius: 28px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.15);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal h2 {
      font-family: 'Fredoka', sans-serif;
      color: var(--accent-color);
      margin-top: 0;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 18px;
    }

    .modal-buttons button {
      font-family: 'Fredoka', sans-serif;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 12px;
      cursor: pointer;
    }

    .modal-buttons button.secondary {
      background-color: #eaeaea;
      color: var(--text-color);
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header-row">
      <h1>✨ Focus Nook</h1>
      <span class="mode-badge" id="mode-badge">Study Session</span>
    </div>

    <!-- Giant Centered Timer -->
    <div class="timer-display" id="timer-display">25:00</div>
    
    <!-- White Buttons (Highlight on click) -->
    <div class="controls">
      <button id="start-btn">Start</button>
      <button id="pause-btn">Pause</button>
      <button id="reset-btn">Reset</button>
    </div>

    <div class="divider"></div>

    <!-- Horizontal Bottom Controls -->
    <div class="bottom-panel">
      <!-- Study & Pause Inputs with Labels -->
      <div class="panel-item">
        <label>Duration (Min)</label>
        <div class="input-box-group">
          <div class="input-sub-item">
            <input type="number" id="study-time" value="25" min="1" max="120" />
            <span>Study time</span>
          </div>
          <div class="input-sub-item">
            <input type="number" id="pause-time" value="5" min="1" max="60" />
            <span>Pause time</span>
          </div>
        </div>
      </div>

      <!-- Color Palette -->
      <div class="panel-item">
        <label>Theme</label>
        <div class="theme-picker">
          <div class="theme-dot" style="background:#FFD8DF;" title="Pink" onclick="setTheme('#FFD8DF', '#e27d60', '#c96549')"></div>
          <div class="theme-dot" style="background:#F0FFDF;" title="Light Green" onclick="setTheme('#F0FFDF', '#66bb6a', '#4cae50')"></div>
          <div class="theme-dot" style="background:#C0F2EE;" title="Cyan" onclick="setTheme('#C0F2EE', '#26a69a', '#00897b')"></div>
          <div class="theme-dot" style="background:#D7C097;" title="Warm Hazel" onclick="setTheme('#D7C097', '#b08958', '#967243')"></div>
        </div>
      </div>

      <!-- Verified Ambient Sounds -->
      <div class="panel-item">
        <label>Background Sound</label>
        <select id="ambient-select" onchange="changeAmbientSound()">
          <option value="">Off</option>
          <option value="https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg">🌧️ Soft Rain</option>
          <option value="https://actions.google.com/sounds/v1/water/ocean_waves.ogg">🌊 Ocean Waves</option>
          <option value="https://actions.google.com/sounds/v1/environments/forest_birds.ogg">🐦 Forest Birds</option>
        </select>
        <audio id="ambient-audio" loop></audio>
      </div>
    </div>
  </div>

  <!-- Notification Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">🎉 Session Complete!</h2>
      <p id="modal-text">You completed your study session! Ready to start your pause?</p>
      <div class="modal-buttons">
        <button id="modal-action-btn" onclick="confirmNextSession()">Start Pause</button>
        <button class="secondary" onclick="closeModal()">Dismiss</button>
      </div>
    </div>
  </div>

  <script>
    let studyDuration = 25 * 60;
    let pauseDuration = 5 * 60;
    let timeRemaining = studyDuration;
    let timerInterval = null;
    let isStudying = true;

    const timerDisplay = document.getElementById('timer-display');
    const modeBadge = document.getElementById('mode-badge');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const resetBtn = document.getElementById('reset-btn');
    const studyInput = document.getElementById('study-time');
    const pauseInput = document.getElementById('pause-time');
    
    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalText = document.getElementById('modal-text');
    const modalActionBtn = document.getElementById('modal-action-btn');
    const ambientAudio = document.getElementById('ambient-audio');

    function setActiveButton(activeBtn) {
      startBtn.classList.remove('active');
      pauseBtn.classList.remove('active');
      resetBtn.classList.remove('active');
      if (activeBtn) activeBtn.classList.add('active');
    }

    function playChime() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
      osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.5); 

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 1);
    }

    function updateDisplay() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function startTimer() {
      if (timerInterval) return;
      setActiveButton(startBtn);

      timerInterval = setInterval(() => {
        timeRemaining--;
        updateDisplay();

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          setActiveButton(null);
          playChime();
          
          if (isStudying) {
            modalTitle.textContent = "🎉 Great Job!";
            modalText.textContent = "You finished your study session! Ready to start your pause?";
            modalActionBtn.textContent = "Start Pause";
          } else {
            modalTitle.textContent = "⚡ Break Finished!";
            modalText.textContent = "Pause is over! Ready to focus again?";
            modalActionBtn.textContent = "Start Studying";
          }
          modalOverlay.classList.add('active');
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      setActiveButton(pauseBtn);
    }

    function resetTimer() {
      pauseTimer();
      setActiveButton(resetBtn);
      setTimeout(() => resetBtn.classList.remove('active'), 300);

      studyDuration = parseInt(studyInput.value, 10) * 60;
      pauseDuration = parseInt(pauseInput.value, 10) * 60;
      timeRemaining = isStudying ? studyDuration : pauseDuration;
      updateDisplay();
    }

    function confirmNextSession() {
      closeModal();
      isStudying = !isStudying;
      
      if (!isStudying) {
        modeBadge.textContent = "Pause Session";
        modeBadge.style.backgroundColor = "#52b788";
        timeRemaining = pauseDuration;
      } else {
        modeBadge.textContent = "Study Session";
        modeBadge.style.backgroundColor = "var(--accent-color)";
        timeRemaining = studyDuration;
      }
      
      updateDisplay();
      startTimer();
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    function setTheme(bgColor, accentColor, accentHover) {
      document.documentElement.style.setProperty('--bg-color', bgColor);
      document.documentElement.style.setProperty('--accent-color', accentColor);
      document.documentElement.style.setProperty('--accent-hover', accentHover);
    }

    function changeAmbientSound() {
      const src = document.getElementById('ambient-select').value;
      if (src) {
        ambientAudio.src = src;
        ambientAudio.play();
      } else {
        ambientAudio.pause();
      }
    }

    // Event Listeners
    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);

    studyInput.addEventListener('change', () => {
      studyDuration = parseInt(studyInput.value, 10) * 60;
      if (isStudying) resetTimer();
    });

    pauseInput.addEventListener('change', () => {
      pauseDuration = parseInt(pauseInput.value, 10) * 60;
      if (!isStudying) resetTimer();
    });

    updateDisplay();
  </script>
</body>
</html>
